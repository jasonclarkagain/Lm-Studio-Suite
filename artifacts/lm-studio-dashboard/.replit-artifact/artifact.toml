kind = "web"
previewPath = "/"
title = "LM Studio Dashboard"
version = "1.0.0"
id = "artifacts/lm-studio-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/lm-studio" ]
localPort = 20545

[services.env]
PORT = "20545"
BASE_PATH = "/"

[services.development]
run = "pnpm --filter @workspace/lm-studio-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lm-studio-dashboard", "run", "build" ]
publicDir = "artifacts/lm-studio-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
